name: Clinical ML CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint (full rule set)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.3.0"

      - name: Run Ruff with the rules configured in pyproject.toml
        run: ruff check . --output-format=github

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch and project dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Execute unit and integration test suite
        run: |
          pytest tests/ -v --tb=short

      - name: Verify CLI entrypoint help
        run: |
          heart-pipeline --help
          heart-pipeline baselines --help

  pipeline-smoke:
    name: Pipeline smoke run (regenerates artifacts)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install CPU PyTorch and project dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run a short end-to-end pipeline into a scratch directory
        run: |
          heart-pipeline --epochs 5 --cv-folds 3 --cv-repeats 1 --run-baselines \
            --run-advancements --output-dir ci_artifacts

      - name: Upload regenerated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ci_artifacts/
          retention-days: 7
