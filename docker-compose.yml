services:
  cardiograph-cds:
    build: .
    container_name: cardiograph-cds
    ports:
      - "8000:8000"
    environment:
      - CDS_DEVICE=cpu
      - CDS_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000
    volumes:
      - cds_audit:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cardiograph-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cardiograph-cds
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: cardiograph-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cardiograph_cds.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  cds_audit:
